[package]
name = "voxharbor-protocol"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/MeghdadFadaee/VoxHarbor"

[workspace]

[dependencies]
tsclientlib = { path = "vendor/tsclientlib/tsclientlib", default-features = false, features = ["raw-audio"] }
tsproto-packets = { path = "vendor/tsclientlib/utils/tsproto-packets" }
tsproto = { path = "vendor/tsclientlib/tsproto" }
base64 = "0.22"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
